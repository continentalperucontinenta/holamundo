<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creación de Sesiones de Aprendizaje</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background-color: #f4f4f9;
    }
    .container {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: #555;
    }
    input[type="text"], select {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Creación de Sesiones de Aprendizaje</h1>
    <form>
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="titulo" placeholder="Escribe el título de la sesión">

      <label for="nivel">Nivel educativo:</label>
      <select id="nivel" name="nivel">
        <option value="primaria">Primaria</option>
        <option value="secundaria">Secundaria</option>
      </select>
    </form>
  </div>
</body>
</html>
